<!-- templates/settings_panel.html -->

<!-- SETTINGS PANEL OVERLAY -->
<div id="settings-overlay" class="settings-panel-overlay" style="display:none;">
    
    <!-- SLIDING SETTINGS PANEL -->
    <div id="settings-panel" class="settings-panel">

        <!-- CLOSE BUTTON -->
        <span class="settings-close" onclick="closeSettings()">×</span>

        <h3>Settings</h3>

        <!-- EDIT PROFILE -->
        <div class="settings-option"
             onclick="window.location.href='{{ url_for('edit_profile', username=session.get('username')) }}'">
            <span class="settings-icon">👤</span> Edit Profile
        </div>

        <!-- CHANGE PASSWORD -->
        <!-- <div class="settings-option"
             onclick="window.location.href='{{ url_for('change_password') }}'">
            Change Password
        </div> -->

        <!-- FORGOT PASSWORD -->
        <!-- <div class="settings-option"
             onclick="window.location.href='{{ url_for('forgot_password') }}'">
            Forgot Password
        </div> -->

        <!-- EDIT INTERESTS -->
        <div class="settings-option"
             onclick="window.location.href='{{ url_for('edit_interests', username=session.get('username')) }}'">
            <span class="settings-icon">🏷️</span> Edit Interests (Genres)
        </div>

        <!-- PRIVACY SETTINGS (if needed later) -->
        <!-- <div class="settings-option"
             onclick="window.location.href='{{ url_for('profile_by_username', username=session.get('username')) }}'">
            Privacy Settings
        </div> -->

        <!-- LOGOUT -->
        <div class="settings-option settings-option-danger"
             onclick="window.location.href='{{ url_for('logout') }}'">
            <span class="settings-icon">🚪</span> Logout
        </div>

    </div>
</div>


<!-- INLINE CSS FOR SETTINGS PANEL -->
<style>
    :root {
        --sp-bg: #0d0e13;
        --sp-panel: #171a22;
        --sp-panel-high: #1f232e;
        --sp-border: rgba(255, 255, 255, 0.08);
        --sp-text: #f1f2f6;
        --sp-text-dim: #9ea3b0;
        --sp-accent-1: #6d8dff;
        --sp-accent-2: #a855f7;
        --sp-accent-glow: rgba(109, 141, 255, 0.35);
        --sp-error: #ef4444;
    }

    /* Overlay behind panel */
    .settings-panel-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.65);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        z-index: 2000;
        display: flex;
        justify-content: flex-end;
        align-items: stretch;
    }

    /* The actual sliding box */
    .settings-panel {
        width: 320px;
        background: var(--sp-panel);
        border-left: 1px solid var(--sp-border);
        height: 100%;
        padding: 25px;
        border-radius: 20px 0 0 20px;
        box-shadow: -12px 0 40px rgba(0,0,0,0.5);
        transform: translateX(100%);
        transition: 0.35s ease;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Panel open animation */
    .settings-panel.open {
        transform: translateX(0);
    }

    /* Close button */
    .settings-close {
        font-size: 24px;
        float: right;
        cursor: pointer;
        color: var(--sp-text-dim);
        margin-top: -5px;
        margin-right: -5px;
        transition: color 0.2s ease;
        line-height: 1;
    }

    .settings-close:hover {
        color: var(--sp-text);
    }

    .settings-panel h3 {
        margin: 0 0 20px 0;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--sp-text);
    }

    /* Settings item */
    .settings-option {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 10px;
        margin: 0 -10px;
        border-radius: 10px;
        border-bottom: 1px solid var(--sp-border);
        font-size: 15px;
        cursor: pointer;
        color: var(--sp-text);
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .settings-option:last-child {
        border-bottom: none;
    }

    .settings-icon {
        font-size: 16px;
        flex-shrink: 0;
    }

    .settings-option:hover {
        padding-left: 16px;
        background: var(--sp-panel-high);
        color: var(--sp-accent-1);
    }

    .settings-option-danger:hover {
        color: var(--sp-error);
    }
</style>
