<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Interests - ReadNext</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login_style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0e13;
            --panel: #171a22;
            --panel-high: #1f232e;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f1f2f6;
            --text-dim: #9ea3b0;
            --accent-1: #6d8dff;
            --accent-2: #a855f7;
            --accent-glow: rgba(109, 141, 255, 0.35);
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(109, 141, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(23, 26, 34, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 12px;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .counter {
            display: inline-block;
            background: var(--panel-high);
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            font-weight: 700;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .counter.active {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            border-color: transparent;
            transform: scale(1.05);
            box-shadow: 0 6px 18px var(--accent-glow);
        }

        .flash-messages {
            list-style: none;
            margin-bottom: 20px;
        }

        .flash-messages li {
            background: rgba(245, 158, 11, 0.12);
            border-left: 4px solid var(--warning);
            padding: 12px 20px;
            border-radius: 8px;
            color: var(--text);
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
            font-size: 14px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .interests-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .interest-wrapper { position: relative; }

        .interest-card {
            background: var(--panel-high);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 16px;
            padding: 25px 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            min-height: 100px;
            position: relative;
            overflow: hidden;
        }

        .interest-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .interest-card span {
            position: relative;
            z-index: 1;
        }

        .interest-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(109, 141, 255, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        input[type=checkbox] { display: none; }

        input[type=checkbox]:checked + label {
            background: transparent;
            color: white;
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        input[type=checkbox]:checked + label::before {
            opacity: 1;
        }

        input[type=checkbox]:checked + label::after {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 10px;
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            z-index: 2;
            animation: checkmark 0.3s ease;
        }

        @keyframes checkmark {
            0% { transform: scale(0) rotate(-45deg); }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .button-container {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 45px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 18px var(--accent-glow);
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px var(--accent-glow);
        }

        button:active { transform: translateY(0); }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button span { position: relative; z-index: 1; }

        .select-all-btn {
            background: var(--panel-high);
            border: 1px solid var(--border);
            box-shadow: none;
            padding: 12px 25px;
            font-size: 0.95rem;
        }

        .select-all-btn:hover {
            background: #262b38;
            box-shadow: none;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 1.9rem; }
            .subtitle { font-size: 1rem; }

            .interests-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }

            .interest-card {
                padding: 20px 10px;
                min-height: 90px;
                font-size: 0.9rem;
            }

            button { padding: 12px 35px; font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .interests-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>What are you interested in?</h1>
        <p class="subtitle">Select at least 5 genres to personalize your recommendations</p>
        <div class="counter" id="counter">
            <span id="count">0</span> selected
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="flash-messages">
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form method="POST" id="interestsForm">
            <div class="interests-grid">
                {% for g in genres %}
                    <div class="interest-wrapper">
                        <input type="checkbox" id="genre{{ g.genre_id }}" name="interests" value="{{ g.genre_id }}">
                        <label for="genre{{ g.genre_id }}" class="interest-card">
                            <span>{{ g.genre_name }}</span>
                        </label>
                    </div>
                {% endfor %}
            </div>

            <div class="button-container">
                <button type="button" class="select-all-btn" id="selectAllBtn">
                    <span>Select All</span>
                </button>
                <button type="submit" id="submitBtn" disabled>
                    <span>Continue</span>
                </button>
            </div>
        </form>
    </div>

    <script>
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        const counter = document.getElementById('counter');
        const countSpan = document.getElementById('count');
        const submitBtn = document.getElementById('submitBtn');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const form = document.getElementById('interestsForm');

        function updateCounter() {
            const checkedCount = document.querySelectorAll('input[type="checkbox"]:checked').length;
            countSpan.textContent = checkedCount;

            if (checkedCount >= 5) {
                counter.classList.add('active');
                submitBtn.disabled = false;
            } else {
                counter.classList.remove('active');
                submitBtn.disabled = true;
            }
        }

        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', updateCounter);
        });

        selectAllBtn.addEventListener('click', function() {
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);

            checkboxes.forEach(checkbox => {
                checkbox.checked = !allChecked;
            });

            this.querySelector('span').textContent = allChecked ? 'Select All' : 'Deselect All';
            updateCounter();
        });

        // Prevent form submission if less than 5 selected
        form.addEventListener('submit', function(e) {
            const checkedCount = document.querySelectorAll('input[type="checkbox"]:checked').length;
            if (checkedCount < 5) {
                e.preventDefault();
                alert('Please select at least 5 genres to continue.');
            }
        });

        // Initialize counter on page load
        updateCounter();
    </script>
</body>
</html>
