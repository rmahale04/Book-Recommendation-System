<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit Interests - ReadNext</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0e13;
      --panel: #171a22;
      --panel-high: #1f232e;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f2f6;
      --text-dim: #9ea3b0;
      --accent-1: #6d8dff;
      --accent-2: #a855f7;
      --accent-glow: rgba(109, 141, 255, 0.35);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .page-wrap {
      max-width: 1000px;
      margin: 40px auto 0;
      padding: 0 24px;
    }

    .container {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -120px;
      width: 320px;
      height: 320px;
      background: var(--accent-1);
      opacity: 0.08;
      filter: blur(90px);
      pointer-events: none;
    }

    .container > * { position: relative; z-index: 1; }

    h2 {
      font-size: 2.1rem;
      margin-bottom: 10px;
      color: var(--text);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-dim);
      margin-bottom: 24px;
    }

    .counter {
      display: inline-block;
      background: var(--panel-high);
      border: 1px solid var(--border);
      padding: 8px 20px;
      border-radius: 20px;
      margin-bottom: 30px;
      font-weight: 700;
      color: var(--text-dim);
      transition: all 0.3s ease;
    }

    .counter.active {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: white;
      border-color: transparent;
      transform: scale(1.05);
      box-shadow: 0 6px 18px var(--accent-glow);
    }

    .interests-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      margin: 20px 0 10px;
    }

    .interest-wrapper { position: relative; }

    .interest-card {
      background: var(--panel-high);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 16px;
      padding: 25px 15px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      min-height: 100px;
      position: relative;
      overflow: hidden;
    }

    .interest-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .interest-card span {
      position: relative;
      z-index: 1;
    }

    .interest-card:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: rgba(109, 141, 255, 0.4);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
    }

    input[type=checkbox] { display: none; }

    input[type=checkbox]:checked + label {
      background: transparent;
      color: white;
      border-color: transparent;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    input[type=checkbox]:checked + label::before {
      opacity: 1;
    }

    input[type=checkbox]:checked + label::after {
      content: '✓';
      position: absolute;
      top: 8px;
      right: 10px;
      width: 24px;
      height: 24px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      z-index: 2;
      animation: checkmark 0.3s ease;
    }

    @keyframes checkmark {
      0% { transform: scale(0) rotate(-45deg); }
      50% { transform: scale(1.2) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .button-container {
      margin-top: 30px;
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button, .btn-cancel {
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      display: inline-block;
      font-family: inherit;
    }

    button {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      box-shadow: 0 6px 18px var(--accent-glow);
    }

    .btn-cancel {
      background: var(--panel-high);
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow: none;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px var(--accent-glow);
    }

    .btn-cancel:hover {
      background: #262b38;
    }

    button:active, .btn-cancel:active { transform: translateY(0); }

    button span, .btn-cancel span { position: relative; z-index: 1; }

    .select-all-btn {
      background: var(--panel-high);
      border: 1px solid var(--border);
      box-shadow: none;
      padding: 12px 25px;
      font-size: 0.9rem;
    }

    .select-all-btn:hover {
      background: #262b38;
      box-shadow: none;
    }

    @media (max-width: 768px) {
      .container { padding: 30px 20px; }
      h2 { font-size: 1.7rem; }
      .subtitle { font-size: 0.95rem; }

      .interests-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }

      .interest-card {
        padding: 20px 10px;
        min-height: 90px;
        font-size: 0.9rem;
      }

      button, .btn-cancel {
        padding: 12px 30px;
        font-size: 0.95rem;
      }
    }

    @media (max-width: 480px) {
      .interests-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>
  {% include "nav_page.html" %}

  <div class="page-wrap">
    <div class="container">
      <h2>Edit Your Interests</h2>
      <p class="subtitle">Update your genre preferences to get better recommendations</p>
      <div class="counter" id="counter">
        <span id="count">0</span> selected
      </div>

      <form method="post" id="interestsForm">
        <div class="interests-grid">
          {% for g in genres %}
            <div class="interest-wrapper">
              <input type="checkbox" id="genre{{ g.genre_id }}" name="interests" value="{{ g.genre_id }}" {% if g.genre_id|string in selected %}checked{% endif %}>
              <label for="genre{{ g.genre_id }}" class="interest-card">
                <span>{{ g.genre_name }}</span>
              </label>
            </div>
          {% endfor %}
        </div>

        <div class="button-container">
          <button type="button" class="select-all-btn" id="selectAllBtn">
            <span>Select All</span>
          </button>
          <button type="submit">
            <span>Save Changes</span>
          </button>
          <a href="{{ url_for('profile_root') }}" class="btn-cancel">
            <span>Cancel</span>
          </a>
        </div>
      </form>
    </div>
  </div>

  <script>
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    const counter = document.getElementById('counter');
    const countSpan = document.getElementById('count');
    const selectAllBtn = document.getElementById('selectAllBtn');

    function updateCounter() {
      const checkedCount = document.querySelectorAll('input[type="checkbox"]:checked').length;
      countSpan.textContent = checkedCount;

      if (checkedCount > 0) {
        counter.classList.add('active');
      } else {
        counter.classList.remove('active');
      }
    }

    checkboxes.forEach(checkbox => {
      checkbox.addEventListener('change', updateCounter);
    });

    selectAllBtn.addEventListener('click', function() {
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);

      checkboxes.forEach(checkbox => {
        checkbox.checked = !allChecked;
      });

      this.querySelector('span').textContent = allChecked ? 'Select All' : 'Deselect All';
      updateCounter();
    });

    updateCounter();
  </script>
</body>
</html>
