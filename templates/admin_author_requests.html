<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Author Requests - Admin | ReadNext</title>

    <style>
/* ========================================
   GLOBAL
======================================== */
* {
    box-sizing: border-box;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
}

body {
    margin: 0;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(109, 141, 255, 0.12),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(168, 85, 247, 0.12),
            transparent 32%
        ),
        #0d0e13;

    color: #f1f2f6;

    min-height: 100vh;
}


/* ========================================
   PAGE WRAPPER
======================================== */
.page-wrapper {
    padding: 35px;
}


/* ========================================
   PAGE TITLE
======================================== */
.page-title {
    font-size: 27px;

    font-weight: 700;

    margin-bottom: 22px;

    color: #f1f2f6;

    position: relative;
}

.page-title::after {
    content: "";

    display: block;

    width: 65px;
    height: 3px;

    margin-top: 9px;

    border-radius: 10px;

    background: linear-gradient(
        90deg,
        #6d8dff,
        #a855f7
    );
}


/* ========================================
   CARD
======================================== */
.card {
    background: linear-gradient(
        145deg,
        #15171f,
        #11131a
    );

    border-radius: 16px;

    border: 1px solid rgba(255, 255, 255, 0.07);

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.35);

    padding: 20px;

    overflow-x: auto;
}


/* ========================================
   TABLE
======================================== */
table {
    width: 100%;

    border-collapse: collapse;

    min-width: 900px;

    color: #dfe2ea;
}


/* ========================================
   TABLE HEADER
======================================== */
thead {
    background: #1e212b;

    position: sticky;

    top: 0;

    z-index: 1;
}


th,
td {
    padding: 14px 16px;

    text-align: left;

    vertical-align: top;
}


th {
    font-size: 13px;

    font-weight: 600;

    color: #f1f2f6;

    border-bottom: 1px solid rgba(255, 255, 255, 0.12);

    text-transform: uppercase;

    letter-spacing: 0.4px;
}


td {
    font-size: 14px;

    color: #bfc4d0;

    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}


/* ========================================
   TABLE HOVER
======================================== */
tr {
    transition: background 0.2s ease;
}

tr:hover td {
    background: rgba(109, 141, 255, 0.06);
}


tr:last-child td {
    border-bottom: none;
}


/* ========================================
   BIO
======================================== */
.bio {
    max-width: 350px;

    line-height: 1.6;

    color: #9ea3b0;
}


/* ========================================
   ACTION BUTTONS
======================================== */
.action-buttons {
    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}


/* ========================================
   COMMON BUTTON
======================================== */
.btn {
    padding: 8px 14px;

    border: none;

    border-radius: 8px;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
}


.btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.30);

    opacity: 0.95;
}


.btn:active {
    transform: translateY(0);
}


/* ========================================
   APPROVE BUTTON
======================================== */
.approve {
    background: linear-gradient(
        135deg,
        #34d399,
        #10b981
    );

    color: #ffffff;

    box-shadow:
        0 5px 15px rgba(52, 211, 153, 0.12);
}


/* ========================================
   REJECT BUTTON
======================================== */
.reject {
    background: linear-gradient(
        135deg,
        #fb7185,
        #ef4444
    );

    color: #ffffff;

    box-shadow:
        0 5px 15px rgba(239, 68, 68, 0.12);
}


/* ========================================
   EMPTY STATE
======================================== */
.empty-state {
    text-align: center;

    padding: 50px 10px;

    color: #777d8c;

    font-size: 15px;
}


/* ========================================
   SCROLLBAR
======================================== */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: #0d0e13;
}

::-webkit-scrollbar-thumb {
    background: #303442;

    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #6d8dff;
}


/* ========================================
   RESPONSIVE
======================================== */
@media (max-width: 768px) {

    .page-wrapper {
        padding: 20px 15px;
    }

    .page-title {
        font-size: 23px;
    }

    .card {
        padding: 15px;
        border-radius: 14px;
    }

    th,
    td {
        padding: 12px;
    }
}


/* ========================================
   SMALL MOBILE
======================================== */
@media (max-width: 480px) {

    .page-wrapper {
        padding: 15px 10px;
    }

    .page-title {
        font-size: 21px;
    }

    .action-buttons {
        flex-direction: column;
    }

    .btn {
        width: 100%;
    }
}
</style>
</head>
<body>

<div class="page-wrapper">

    <div class="page-title">Pending Author Requests</div>

    <div class="card">
        {% if requests %}
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Date of Birth</th>
                    <th>Biography</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for r in requests %}
                <tr>
                    <td>{{ r.name }}</td>
                    <td>{{ r.email }}</td>
                    <td>{{ r.date_of_birth }}</td>
                    <td class="bio">{{ r.biography[:150] }}...</td>
                    <td>
                        <div class="action-buttons">
                            <form method="POST" action="{{ url_for('approve_author', request_id=r.request_id) }}">
                                <button class="btn approve">Approve</button>
                            </form>
                            <form method="POST" action="{{ url_for('reject_author', request_id=r.request_id) }}">
                                <button class="btn reject">Reject</button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="empty-state">
            No pending author requests 🎉
        </div>
        {% endif %}
    </div>

</div>

</body>
</html>
